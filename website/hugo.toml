#
# Hugo configuration for the k8s-kms-plugin documentation site (Hugo + Hextra).
#
# The site lives in this subdirectory rather than at the repository root for one reason: Hugo
# Modules are Go modules, so a root-level Hugo project would add the theme to the plugin's own
# go.mod — where it would reach `go mod tidy`, NOTICE.md and govulncheck, none of which should
# know about a documentation theme. Keeping it here gives the site its own go.mod and leaves the
# plugin's module graph untouched.
#
# Content is *mounted* from ../docs rather than copied, so docs/ stays the single source of truth
# and keeps rendering on GitHub. See [[module.mounts]] below.
#
# Build:
#   make site-serve    # http://localhost:1313/k8s-kms-plugin/
#   make site          # -> website/public/

# baseURL is only the local-dev default. Do NOT rely on it being right for whoever publishes: the
# Docs workflow computes the URL from the owner and repository actually running the build and passes
# it with --baseURL, so the same config publishes correctly from this repository and from any fork
# with nothing to remember.
#
# Override it locally the same way:  hugo --baseURL https://example.github.io/k8s-kms-plugin/
baseURL = 'https://eclipse-keysealer.github.io/k8s-kms-plugin/'
title = 'k8s-kms-plugin'
locale = 'en-us'

# GitHub Pages serves a project site from a subpath (/k8s-kms-plugin/), so every asset and link has
# to carry it. Hugo derives that from baseURL and emits root-relative paths such as
# /k8s-kms-plugin/css/main.css.
#
# Do NOT set relativeURLs = true here. It looks like it would make the output more portable, but it
# double-applies the subpath: Hugo emits a relative prefix back to the site root AND keeps the path
# component of baseURL, so the stylesheet on the home page becomes
#
#   ./k8s-kms-plugin/css/…      -> /k8s-kms-plugin/k8s-kms-plugin/css/…   (404)
#
# and on a nested page ../../k8s-kms-plugin/css/… resolves to the same doubled path. The result is a
# site with no CSS and broken navigation, and the build reports no error. relativeURLs exists for
# browsing output over file://, not for hosting under a subpath.

# This is a documentation site: tag and category term pages would be empty and only add noise to
# the sitemap. Must stay at the top level — nested under [module] it is silently ignored.
disableKinds = ['taxonomy', 'term']

[module]
  # Hextra requires Hugo 0.146.0 or newer. Not the extended build: Hextra v0.12.x ships its
  # Tailwind CSS precompiled under assets/css/compiled/, so there is no SCSS to transpile.
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

  [[module.imports]]
    path = 'github.com/imfing/hextra'

  # Mount ../docs as the documentation section.
  #
  # Hugo recognises only _index.md as a section index, so every README.md is excluded from the bulk
  # mount and re-mounted under that name. Keeping README.md on disk is deliberate: it is what GitHub
  # renders when browsing to the directory.
  #
  # PlantUML and drawio sources ARE published, even though the pages embed the committed .svg
  # renderings instead: several pages link to the sources, and excluding them turned those links
  # into 404s on the site. They are a few kilobytes of text.
  #
  # Two things about `files` that fail silently if you get them wrong:
  #
  #  1. An exclusion needs the space after the bang ('! foo', not '!foo'). Hugo matches the literal
  #     prefix "! ", so '!foo' is read as an ordinary include pattern that matches nothing.
  #  2. Order matters. Hugo evaluates the patterns in sequence and returns on the FIRST match, so a
  #     leading catch-all '**' matches everything and no exclusion after it is ever consulted. The
  #     exclusions therefore come first and '**' last.
  #
  # Neither mistake produces a warning — the mount just quietly includes everything.
  #
  # Both 'README.md' and '**/README.md' are listed because '**/' does not match a file sitting at
  # the mount root.
  [[module.mounts]]
    source = '../docs'
    target = 'content/docs'
    files = ['! README.md', '! **/README.md', '! termbase.yaml', '! **/*.bkp', '**']

  # The glossary. Hextra's `glossary` layout builds its <dl> from a Hugo DATA file — site.Data.<lang>
  # .termbase — and ignores the page body, so the terms have to arrive as data rather than content.
  # Mounting docs/termbase.yaml here keeps them in docs/ with everything else instead of stranding
  # them under website/, and docs/glossary.md is generated from the same file so GitHub renders the
  # terms too (`make glossary`; CI checks it). The file is excluded from the content mount above —
  # otherwise it would also be published as a page resource.
  [[module.mounts]]
    source = '../docs/termbase.yaml'
    target = 'data/en/termbase.yaml'

  [[module.mounts]]
    source = '../docs/README.md'
    target = 'content/docs/_index.md'

  [[module.mounts]]
    source = '../docs/hsm-guides/README.md'
    target = 'content/docs/hsm-guides/_index.md'

  [[module.mounts]]
    source = '../docs/kubernetes-guides/README.md'
    target = 'content/docs/kubernetes-guides/_index.md'

  [[module.mounts]]
    source = '../docs/tools-and-scripts/README.md'
    target = 'content/docs/tools-and-scripts/_index.md'

  [[module.mounts]]
    source = '../docs/cli-user-interface/README.md'
    target = 'content/docs/cli-user-interface/_index.md'

  [[module.mounts]]
    source = '../docs/cli-user-interface/markdown/README.md'
    target = 'content/docs/cli-user-interface/markdown/_index.md'

  # The site's own content — the home page.
  [[module.mounts]]
    source = 'content'
    target = 'content'

  [[module.mounts]]
    source = 'assets'
    target = 'assets'

  [[module.mounts]]
    source = 'static'
    target = 'static'

[markup]
  # Code fences carry Hextra attributes — ```yaml {filename="…",linenos=table,hl_lines=[6,18]} —
  # which Hugo parses itself from the fence info string and passes to the theme's codeblock render
  # hook. That needs NO [markup.goldmark.parser.attribute] setting: `block = true` governs attributes
  # on *other* block elements and is irrelevant here, so do not add it expecting fences to depend on
  # it. See website/README.md for when to use each attribute.
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Required. The documentation uses <details>/<summary> for collapsible sections and a few
      # inline HTML tags. Goldmark silently DISCARDS raw HTML unless this is set — eleven
      # collapsible blocks would vanish from the published pages with no build error at all.
      unsafe = true

  [markup.highlight]
    # Hextra ships Chroma stylesheets for both light and dark; inlining classes here would override
    # them and break syntax highlighting in dark mode.
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  # Mermaid diagrams work through Hextra's ```mermaid codeblock render hook.
  #
  # Both Mermaid and FlexSearch are fetched at BUILD time by Hextra and re-served from this site
  # with a Subresource Integrity hash, so the published pages never call out to a CDN. The versions
  # are pinned deliberately: Hextra's default Mermaid base is `mermaid@latest`, which would let an
  # upstream release change what this site ships without a single commit here — the same reasoning
  # that pins every GitHub Action to a SHA.
  #
  # To build with no network at all, drop the two files into website/assets/js/ and replace `base`
  # with `js = 'js/mermaid.min.js'` here and `js = 'js/flexsearch.bundle.min.js'` below.
  [params.mermaid]
    base = 'https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist'

  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      version = '0.8.143'
      # Index whole sections rather than single headings: these pages are long references where a
      # hit is more useful with its surrounding context.
      index = 'content'

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.page]
    width = 'wide'

  [params.theme]
    # Follow the reader's OS preference, with a toggle in the navbar.
    default = 'system'
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  # "Edit this page" is off because it is incompatible with mounting content from outside the
  # project. Hextra builds the path as TrimPrefix(Meta.BaseDir, Meta.SourceRoot), which cancels out
  # only when content sits at <project>/content/. Here SourceRoot is /<repo>/docs while BaseDir is
  # /<repo>/website, so nothing is trimmed and the absolute source path is spliced into the URL:
  #
  #   .../edit/master/docs/home/user/k8s-kms-plugin/docs/docs/overview.md
  #
  # .File.Path on its own is already the repo-relative path ("docs/overview.md"), so a corrected
  # link is one expression away — but only by overriding Hextra's toc.html wholesale, which would
  # vendor ~60 lines of theme markup that then diverges silently on every theme upgrade. Not worth
  # it for a convenience link; revisit if Hextra makes the path prefix configurable.
  [params.editURL]
    enable = false

  [params.blog]
    enable = false

[menu]
  [[menu.main]]
    name = 'Documentation'
    pageRef = '/docs'
    weight = 1

  [[menu.main]]
    name = 'Search'
    weight = 2
    [menu.main.params]
      type = 'search'

  [[menu.main]]
    name = 'GitHub'
    url = 'https://github.com/eclipse-keysealer/k8s-kms-plugin'
    weight = 3
    [menu.main.params]
      icon = 'github'

  # The documentation index is the docs section's own page (docs/README.md, mounted above as
  # content/docs/_index.md), and Hextra's sidebar tree lists only the pages INSIDE a section, never
  # the section itself — so without this entry the index is missing from the sidebar entirely.
  # menu.sidebar renders below the page tree, which is where the index belongs: reachable from every
  # page, but after Concepts & Architecture (where readers get started) and the Quick start.
  [[menu.sidebar]]
    name = 'Documentation index'
    pageRef = '/docs'
    weight = 1
