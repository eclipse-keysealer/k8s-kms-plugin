# k8s-kms-plugin configuration file example
#
# Every key below mirrors a CLI flag. The section path mirrors the command path, so
# `serve --p11-pin` is k8s-kms-plugin.serve.p11-pin and its environment variable is
# K8S_KMS_PLUGIN_SERVE_P11_PIN. Values resolve in this order:
#
#   CLI flag  >  environment variable  >  this file  >  default
#
# This file is NOT picked up automatically from /etc. Pass it explicitly:
#
#   k8s-kms-plugin --config /etc/k8s-kms-plugin/k8s-kms-plugin.config.yaml serve
#
# or name it k8s-kms-plugin.conf.yaml in $HOME or $HOME/.config/k8s-kms-plugin/, which
# are the only two locations searched when --config and K8S_KMS_PLUGIN_CONFIG are unset.
#
# `k8s-kms-plugin serve --help` is the authoritative list of flags and defaults; the
# full table is in docs/cli-user-interface/markdown/cli-env-var-table.md.

k8s-kms-plugin:

  # ---------------------------------------------------------------- root flags --------
  ## log-level possible values: trace, debug, info, warn, error, quiet.
  log-level: "trace"
  ## debug: true is equivalent to log-level: debug. The two are mutually exclusive —
  ## in a configuration file, prefer log-level.
  #debug: false
  ## log-format possible values: text, json.
  log-format: "json"

  # ---------------------------------------------------------------------- serve -------
  serve:

    ## Unix socket the gRPC server listens on. This is the only transport: KMS v2
    ## supports a local socket only, so there is nothing here about TLS, hosts or ports.
    ## The socket is created with mode 0775 so a client under a shared gid can connect.
    socket: "/run/k8s-kms-plugin/k8s-kms-plugin.sock"

    ### The PKCS #11 token holding the KEK
    provider: "p11" # possible values: p11, softhsm, luna, dpod
    p11-lib: "/usr/local/lib/softhsm/libsofthsm2.so"
    p11-label: "my-token-label"
    #p11-slot: 0 # OPTIONAL slot index; only needed when the label does not identify one token
    ## The PIN is a secret. Prefer the environment variable
    ## K8S_KMS_PLUGIN_SERVE_P11_PIN over this file, or omit it entirely to be prompted
    ## interactively with hidden input. Set it to "" for a token with no PIN.
    #p11-pin: "1234"

    ### The KEK itself
    ## algorithm-family possible values: aes-gcm, aes-cbc, rsa-oaep, ml-kem.
    ## The key size and the ML-KEM parameter set are NOT configured here: they are read
    ## from the key on the token at startup.
    algorithm-family: "rsa-oaep"
    ## Identify the KEK by CKA_LABEL or by CKA_ID — exactly one of the two is required,
    ## and the key must match the mechanism implied by algorithm-family.
    p11-key-label: "my-key"
    #p11-key-id: "aa22334455bc" # hex CKA_ID; mutually exclusive with p11-key-label
    ## aes-cbc only: the HMAC key that authenticates the ciphertext. Label or ID, exactly
    ## one of the two, same rule as the KEK.
    #p11-hmac-label: "my-hmac-key-for-cbc"
    #p11-hmac-id: "49c6b305210f"
    ## auto-create: generate the KEK on the token if it is missing. Not supported for
    ## ml-kem — that key pair has to be provisioned on the HSM beforehand.
    #auto-create: false

    ## --------------------------------------------------------- serve rotation --------
    ## Read by `k8s-kms-plugin serve rotation`, which serves the KEK above for both
    ## encryption and decryption while ALSO decrypting data written under a previous KEK.
    ## It does not re-encrypt anything by itself: kube-apiserver rewrites objects, and
    ## each DecryptRequest is routed by its key_id. The old KEK may live on another token
    ## or another HSM, which is why the whole set of settings is repeated here.
    #rotation:
      #old-provider: "p11"
      #old-p11-lib: "/usr/local/lib/softhsm/libsofthsm2.so"
      #old-p11-label: "my-token-label"
      #old-p11-slot: 0
      ## Prefer K8S_KMS_PLUGIN_SERVE_ROTATION_OLD_P11_PIN over putting the PIN here.
      #old-p11-pin: "1234"
      #old-algorithm-family: "aes-cbc" # the family the old KEK was used with
      #old-p11-key-label: "old-key-label"
      #old-p11-key-id: "7c7ce2d85d63" # mutually exclusive with old-p11-key-label
      #old-p11-hmac-label: "old-hmac-key-for-cbc" # aes-cbc only
      #old-p11-hmac-id: "a72d4a0059ac" # mutually exclusive with old-p11-hmac-label

  # -------------------------------------------------------------------- version -------
  version:
    ## Format of the version output. One of 'yaml' or 'json'.
    output: "json"
    pretty: true # only for JSON output
