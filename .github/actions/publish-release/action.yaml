# .github/actions/publish-release/action.yml
#
# Runs the release process: pushes the container image, runs GoReleaser,
# collects outputs for SLSA provenance jobs, and signs the container image.
#
# Pre-conditions (the calling job must satisfy these before calling this action):
#   1. actions/checkout with fetch-depth: 0
#   2. ./.github/actions/setup-build-env  (Go, cross-compilers, ko, cosign, syft, trivy)
#   3. docker/login-action or equivalent for the target registry
#
# Required calling-job permissions:
#   contents: write   — create the GitHub Release and upload assets
#   packages: write   — push container image to GHCR
#   id-token: write   — cosign keyless signing via OIDC (no human interaction)

name: Publish release
description: >
  Runs GoReleaser (build all arches, sign blobs, generate SBOMs, publish release
  and container image), then signs the image with cosign and surfaces the outputs
  needed by the SLSA3 provenance generator jobs.

inputs:
  github_token:
    required: true
    description: GitHub token for the release and registry push

outputs:
  hashes:
    value: ${{ steps.binary.outputs.hashes }}
    description: >
      Base64-encoded contents of the checksum file.
      Consumed by slsa-github-generator for binary SLSA3 provenance.
  name:
    value: ${{ steps.image.outputs.name }}
    description: Published container image name (without tag or digest)
  digest:
    value: ${{ steps.image.outputs.digest }}
    description: Published container image digest (sha256:...)

runs:
  using: composite
  steps:

    # -- GoReleaser -----------------------------------------------------------
    # Builds linux/{amd64,arm64,riscv64}, generates packages and SBOMs, signs all
    # blobs with cosign, and publishes the GitHub Release and container image.
    # Cross-compilers, syft, trivy, and cosign are expected to be on PATH
    # (provided by setup-build-env). LDFLAGS is expected in GITHUB_ENV.
    # --clean removes any stale dist/ from previous runs.
    - name: Run GoReleaser
      id: goreleaser
      # goreleaser/goreleaser-action v7.2.2
      uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LDFLAGS: ${{ env.LDFLAGS }}
        WORKSPACE: ${{ github.workspace }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    # -- SLSA outputs ---------------------------------------------------------
    # Extract the data the SLSA3 provenance generator jobs need from goreleaser's
    # artifact list. Done here so the calling workflow stays clean.

    - name: Collect binary hashes
      id: binary
      shell: bash
      env:
        ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
      run: |
        set -euo pipefail
        checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
        echo "hashes=$(base64 -w0 < "$checksum_file")" >> "$GITHUB_OUTPUT"

    - name: Collect image digest
      id: image
      shell: bash
      env:
        ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
      run: |
        set -euo pipefail
        # goreleaser v2 reports the image as a "Docker Manifest" artifact whose
        # .path is the bare image name and whose digest lives in .extra.Digest.
        # (Older goreleaser put "name@digest" in .path; do not rely on that.)
        manifest=$(echo "$ARTIFACTS" \
          | jq -r '.[] | select(.type=="Docker Manifest")')
        if [[ -z "$manifest" ]]; then
          echo "::error::no Docker Manifest artifact found in goreleaser output"
          exit 1
        fi

        # Strip any "@digest" and a trailing ":tag" (but not a registry port,
        # which is followed by "/").
        name=$(echo "$manifest" | jq -r '.path' | sed -E 's/@.*$//; s/:[^/:]*$//')
        digest=$(echo "$manifest" | jq -r '.extra.Digest // empty')

        if [[ -z "$name" || -z "$digest" ]]; then
          echo "::error::could not resolve image name/digest (name='$name' digest='$digest')"
          exit 1
        fi
        if [[ "$digest" != sha256:* ]]; then
          echo "::error::unexpected image digest format: '$digest'"
          exit 1
        fi

        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    # -- Image signing --------------------------------------------------------
    # Signs the exact image@digest produced above. Handled here rather than via
    # goreleaser docker_signs so signing happens after the digest is confirmed
    # and uses a single, known OIDC identity for the whole release job.
    - name: Sign container image
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
      run: cosign sign --yes "$IMAGE"
