# .github/workflows/scorecard.yml
#
# OpenSSF Scorecard rates the repo's supply-chain security posture (branch
# protection, token permissions, pinned dependencies, dangerous workflow
# patterns) and publishes results to code scanning and the public Scorecard API.
# This repo already does the hard parts (SHA-pinned actions, SLSA3 provenance,
# cosign signing, SBOM attestation), so it should score well.

name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: ["master", "main"]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Top-level token has minimal access; the job requests only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results to the public OpenSSF API
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run analysis
        # ossf/scorecard-action v2.4.2
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to https://api.securityscorecards.dev for the
          # badge. Set to false to keep results private.
          publish_results: true

      - name: Upload artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        # github/codeql-action/upload-sarif v4.36.2
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
