# .github/workflows/security.yaml
#
# Continuous security scanning — runs on every PR, every push to master,
# and on a weekly schedule to catch newly published vulnerabilities.
#
# Jobs:
#   govulncheck : Go-specific vulnerability check against the Go vuln DB (SARIF)
#   codeql      : GitHub SAST engine, Go security-extended query suite (SARIF)
#   trivy-fs    : Filesystem scan — CVEs in Go modules & Containerfiles (SARIF)
#   trivy-image : Scan the container image built from Containerfile (SARIF)
#
# All four jobs upload SARIF to the GitHub Security tab so findings are
# consolidated in one place without blocking the build.

name: Security Scanning

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    # Every Monday at 08:00 UTC — catches newly disclosed CVEs between PRs
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  # -- 1. govulncheck --------------------------------------------------------
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install govulncheck
        # golang.org/x/vuln v1.8.0. Run the tool directly instead of through
        # golang/govulncheck-action: that action performs its own
        # actions/checkout@v4, whose Authorization header collides with the outer
        # checkout's (git fails with "Duplicate header: Authorization" → HTTP 400).
        run: go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c

      - name: Run govulncheck
        # SARIF output is consumed by the upload-sarif step below. Reaching this
        # step is itself the pass/fail signal, so no findings still exits 0.
        run: govulncheck -format sarif ./... > govulncheck.sarif

      - name: Upload govulncheck SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: "govulncheck.sarif"
          category: govulncheck

  # -- 2. CodeQL -------------------------------------------------------------
  codeql:
    name: CodeQL (Go)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        # github/codeql-action/init v4.36.2
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: go
          queries: security-extended

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: codeql-go

  # -- 3. Trivy filesystem scan ----------------------------------------------
  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Trivy filesystem scan
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-fs.sarif"
          exit-code: "0"

      - name: Upload Trivy filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: "trivy-fs.sarif"
          category: trivy-fs

  # -- 4. Trivy container image scan -----------------------------------------
  # Builds the Containerfile (amd64) and scans the resulting image for OS-layer
  # and application CVEs. Runs on all triggers including schedule — the weekly
  # run is the most valuable since it detects CVEs disclosed since the last push.
  #
  # `make image` compiles the binary with the Makefile LDFLAGS and then packages
  # it, so the scanned image contains exactly the artifact the Makefile produces.
  #
  # The build uses podman (preinstalled on the runner), which reads
  # .containerignore directly rather than through the .dockerignore symlink.
  # The image is handed to trivy-action as an archive since it lives in podman's
  # store, not in the docker daemon that trivy-action would otherwise query.
  trivy-image:
    name: Trivy (container image)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # `make image` derives the version from `git describe`
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build image for scanning
        run: |
          make image IMAGE=k8s-kms-plugin:scan
          # docker-archive, not oci-archive: trivy --input reads the former
          podman save --format docker-archive -o k8s-kms-plugin-scan.tar k8s-kms-plugin:scan

      - name: Trivy image scan
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          input: "k8s-kms-plugin-scan.tar"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-image.sarif"
          exit-code: "0"

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: "trivy-image.sarif"
          category: trivy-image
