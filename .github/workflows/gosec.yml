# .github/workflows/gosec.yml
#
# Runs gosec (https://github.com/securego/gosec) — a static-analysis security
# scanner for Go code. Complements the govulncheck job in security.yaml
# (dependency CVEs) by flagging insecure code patterns in this module itself.
# Runs on PRs, pushes to master, and weekly so newly added rules surface even
# without a code change.

name: Security Scan (gosec)

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    # Every Monday at 08:00 UTC — same cadence as security.yaml
    - cron: "0 8 * * 1"
  workflow_dispatch:
  # Allows the Release pipeline to gate a tag on a passing security scan.
  workflow_call:

permissions:
  contents: read

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        # actions/setup-go v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0

      - name: Run gosec
        run: gosec ./...
